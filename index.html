<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自選即時熱力圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #tooltip {
            position: absolute;
            opacity: 0;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 0.875rem;
            z-index: 100;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            min-width: 200px;
        }

        .grab-cursor { cursor: grab; }
        .grabbing-cursor { cursor: grabbing !important; }

        /* ===================================================================
           行動版優化：以下規則「只在 ≤768px 的窄螢幕生效」，
           電腦版（>768px）完全不會套用，排版與操作維持原樣。
           =================================================================== */
        @media (max-width: 768px) {
            body { overscroll-behavior-y: contain; }

            /* 手機版：沿用電腦版同一張 treemap，改用「雙指縮放 + 單指拖曳」操作 */
            #treemapContainer {
                touch-action: none;          /* 由 JS 接管手勢，避免瀏覽器原生捲動干擾縮放 */
                cursor: default !important;
            }
            /* #zoomLayer 維持與電腦版相同的 absolute + transform 行為，這裡不覆寫 */

            /* 縮放控制鈕在手機上也保留（放大 / 重設 / 縮小），按鈕加大好點 */
            #zoomControls {
                bottom: calc(1rem + env(safe-area-inset-bottom, 0px)) !important;
                right: 1rem !important;
            }
            #zoomControls button { padding: 0.6rem !important; }
            #zoomControls svg { width: 1.4rem !important; height: 1.4rem !important; }

            /* 側邊欄在手機上 = 全螢幕滑出抽屜 */
            #sidebar {
                position: fixed !important;
                inset: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                z-index: 50 !important;
                border-right: none !important;
                box-shadow: 0 0 50px rgba(0,0,0,.7);
            }
            #sidebar.hidden { display: none !important; }

            /* header 觸控優化：按鈕加大、間距加寬 */
            header { padding-top: .6rem; padding-bottom: .6rem; }
            #refreshBtn, #colorModeBtn { padding-top: .5rem; padding-bottom: .5rem; font-size: .8rem; }
            #autoUpdateToggle ~ span { display: inline; }
        }

        /* 行動版股票詳情面板（手機點擊個股時滑出；電腦版滑鼠 hover 仍用原本的 tooltip，不會觸發這個） */
        #mobileSheetBackdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,.55);
            z-index: 59; opacity: 0; pointer-events: none; transition: opacity .25s;
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        #mobileSheetBackdrop.show { opacity: 1; pointer-events: auto; }
        #mobileSheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
            background: #1e293b; border-top: 1px solid #334155;
            border-radius: 20px 20px 0 0;
            padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateY(115%);
            transition: transform .3s cubic-bezier(.22,1,.36,1);
            box-shadow: 0 -12px 34px rgba(0,0,0,.55);
        }
        #mobileSheet.show { transform: translateY(0); }
        #mobileSheet .grabber {
            width: 42px; height: 4px; border-radius: 999px; background: #475569;
            margin: -4px auto 14px;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 py-3 px-4 md:px-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-md z-20 relative">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200 transition-colors" title="收合/展開側邊欄">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">自選即時熱力圖</h1>
                    <span id="syncBadge" class="flex h-3 w-3 relative hidden">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                </div>
            </div>
        </div>
        
        <div class="flex flex-wrap items-center gap-3 bg-slate-900/60 p-2 md:p-3 rounded-xl border border-slate-700/60">
            <div class="flex items-center gap-2">
                <span id="updateTimeText" class="text-xs font-mono text-slate-400">尚未更新數據</span>
            </div>
            <div class="h-4 w-px bg-slate-700 hidden sm:block"></div>
            <div class="flex items-center gap-1.5">
                <span class="text-[11px] text-slate-400 font-medium hidden sm:inline">週期</span>
                <div id="periodSelector" class="flex items-center gap-0.5 bg-slate-800/80 p-0.5 rounded-lg border border-slate-700/60">
                    <button data-period="1d"  onclick="setPeriod('1d')"  class="period-btn text-xs font-medium px-2.5 py-1 rounded-md transition-colors">當日</button>
                    <button data-period="3d"  onclick="setPeriod('3d')"  class="period-btn text-xs font-medium px-2.5 py-1 rounded-md transition-colors">三天</button>
                    <button data-period="1wk" onclick="setPeriod('1wk')" class="period-btn text-xs font-medium px-2.5 py-1 rounded-md transition-colors">一週</button>
                    <button data-period="2wk" onclick="setPeriod('2wk')" class="period-btn text-xs font-medium px-2.5 py-1 rounded-md transition-colors">兩週</button>
                </div>
            </div>
            <div class="h-4 w-px bg-slate-700 hidden sm:block"></div>
            <div class="flex items-center gap-3">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="autoUpdateToggle" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500"></div>
                    <span class="ml-2 text-xs text-slate-300 font-medium hidden sm:inline">自動同步 (60s)</span>
                </label>
                <button id="refreshBtn" onclick="refreshData()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-1.5 px-3 rounded-lg shadow transition-all active:scale-95">
                    <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17"></path></svg>
                    立即重整
                </button>
                <button id="colorModeBtn" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold py-1.5 px-3 rounded-lg shadow transition-colors border border-slate-600">
                    台股 (紅漲綠跌)
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" class="w-full lg:w-96 bg-slate-800/80 border-r border-slate-700 flex flex-col overflow-y-auto no-scrollbar transition-all duration-300 relative z-10 flex-shrink-0">
            <div class="md:hidden flex items-center justify-between p-4 border-b border-slate-700 sticky top-0 bg-slate-800 z-10">
                <span class="text-sm font-semibold text-slate-200">設定與清單管理</span>
                <button onclick="toggleSidebar()" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200" title="關閉">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-4 border-b border-slate-700">
                <h2 id="cloudHeader" onclick="toggleCloudPanel()" class="text-sm font-semibold mb-2 flex items-center gap-2 cursor-pointer select-none" title="點此展開 / 收起雲端同步">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                    雲端同步 (跨裝置)
                    <span id="cloudDot" class="ml-auto inline-flex h-2.5 w-2.5 rounded-full bg-slate-500" title="未連線"></span>
                    <svg id="cloudChevron" class="w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </h2>

                <div id="cloudBody">
                    <div id="cloudStatusText" class="text-[11px] text-slate-400 mb-2">尚未啟用雲端同步</div>

                    <div id="cloudSetup" class="space-y-2">
                        <button id="cloudEnableBtn" onclick="cloudEnable()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded transition-colors text-xs">
                            ☁️ 啟用雲端同步（建立同步碼）
                        </button>
                        <div class="flex items-center gap-2">
                            <div class="h-px flex-1 bg-slate-700"></div>
                            <span class="text-[10px] text-slate-500">或在新裝置輸入同步碼</span>
                            <div class="h-px flex-1 bg-slate-700"></div>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="cloudJoinInput" placeholder="貼上同步碼或連結" class="flex-1 bg-slate-900 border border-slate-600 rounded p-1.5 text-sm focus:outline-none focus:border-emerald-500">
                            <button onclick="cloudJoin()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-3 rounded text-xs whitespace-nowrap">連線</button>
                        </div>
                    </div>

                    <div id="cloudConnected" class="space-y-2 hidden">
                        <div class="bg-slate-900 border border-slate-700 rounded p-2">
                            <div class="text-[10px] text-slate-400 mb-1">你的同步碼（在其他裝置貼上即可同步）</div>
                            <div class="flex items-center gap-2">
                                <code id="cloudCodeText" class="flex-1 text-[11px] text-emerald-300 font-mono break-all leading-tight"></code>
                                <button onclick="cloudCopyCode()" class="text-slate-300 hover:text-white p-1 flex-shrink-0" title="複製同步碼"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="cloudCopyLink()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-1.5 rounded text-xs">🔗 複製同步連結</button>
                            <button onclick="cloudPullNow()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-1.5 rounded text-xs">↻ 立即拉取</button>
                        </div>
                        <button onclick="cloudUnlink()" class="w-full text-red-400 hover:text-red-300 text-[11px] py-1">中斷此裝置的同步</button>
                    </div>
                </div>
            </div>

            <div class="p-4 border-b border-slate-700">
                <h2 id="allocHeader" onclick="toggleAllocPanel()" class="text-sm font-semibold mb-3 flex items-center gap-2 cursor-pointer select-none" title="點此展開 / 收起資金配置">
                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                    資金配置 (各分群佔比)
                    <svg id="allocChevron" class="w-4 h-4 text-slate-400 ml-auto transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </h2>
                <div id="allocationPanel"></div>
            </div>

            <div class="p-4 border-b border-slate-700">
                <h2 class="text-sm font-semibold mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    新增分群 (Category)
                </h2>
                <div class="space-y-2">
                    <input type="text" id="catName" onkeydown="if(event.key==='Enter') addCategory()" placeholder="群組名稱 (如: 科技股)" class="w-full bg-slate-900 border border-slate-600 rounded p-1.5 text-sm focus:outline-none focus:border-blue-500">
                    <button onclick="addCategory()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-1.5 rounded transition-colors text-xs">
                        + 新增分群
                    </button>
                </div>
            </div>

            <div class="p-4 border-b border-slate-700">
                <h2 class="text-sm font-semibold mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    新增股票 (Stock)
                </h2>
                <div class="space-y-2">
                    <div class="grid grid-cols-2 gap-2">
    <input type="text" id="stockName" onkeydown="if(event.key==='Enter') addStock()" placeholder="代號 (如 AAPL, 2330, 6547.TWO)" class="col-span-1 bg-slate-900 border border-slate-600 rounded p-1.5 text-sm focus:outline-none focus:border-teal-500">
    <select id="stockParent" onkeydown="if(event.key==='Enter') addStock()" class="col-span-1 bg-slate-900 border border-slate-600 rounded p-1.5 text-sm focus:outline-none focus:border-teal-500"></select>
</div>
                    <button onclick="addStock()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-medium py-1.5 rounded transition-colors text-xs">
                        + 新增股票
                    </button>
                </div>
            </div>

            <div class="p-4 flex-1">
                <div class="flex items-center justify-between mb-3 gap-2">
                    <h2 class="text-sm font-semibold">資料清單管理 (點擊展開)</h2>
                    <button id="toggleAllBtn" onclick="toggleAllCategories()" class="text-[11px] text-slate-300 hover:text-white bg-slate-700/70 hover:bg-slate-600 px-2 py-1 rounded transition-colors flex items-center gap-1 flex-shrink-0" title="一鍵收合 / 展開全部分群">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7"></path></svg>
                        <span id="toggleAllLabel">收合全部</span>
                    </button>
                </div>
                <div id="dataList" class="space-y-2 pb-10"></div>
            </div>
        </aside>

        <section class="flex-1 bg-slate-950 relative overflow-hidden" id="chartWrapper">
            <div id="messageBox" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 text-white px-4 py-2 rounded-lg shadow-xl z-50 text-sm flex items-center gap-2 transition-opacity duration-300">
                <span id="messageText"></span>
            </div>

            <div class="w-full h-full grab-cursor relative overflow-hidden" id="treemapContainer">
                <div id="zoomLayer" class="absolute origin-top-left flex flex-wrap gap-5 p-6 items-start content-start transition-transform duration-75 min-w-[1000px] min-h-[800px]">
                </div>
                <div id="emptyState" class="absolute inset-0 flex items-center justify-center text-slate-500 hidden pointer-events-none">
                    查無資料，請從左側新增。
                </div>
            </div>

            <div id="zoomControls" class="absolute bottom-6 right-6 flex flex-col gap-1.5 bg-slate-800/90 p-1.5 rounded-lg border border-slate-700 shadow-xl backdrop-blur z-20">
                <button onclick="controlZoom(0.1)" class="p-2 hover:bg-slate-700 rounded text-slate-200 transition-colors" title="放大">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                </button>
                <div class="w-full h-px bg-slate-700"></div>
                <button onclick="resetZoom()" class="p-2 hover:bg-slate-700 rounded text-slate-200 transition-colors" title="重設大小與位置">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
                <div class="w-full h-px bg-slate-700"></div>
                <button onclick="controlZoom(-0.1)" class="p-2 hover:bg-slate-700 rounded text-slate-200 transition-colors" title="縮小">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
            </div>
        </section>
    </main>

    <div id="tooltip"></div>

    <div id="mobileSheetBackdrop" onclick="closeMobileSheet()"></div>
    <div id="mobileSheet">
        <div class="grabber"></div>
        <div id="mobileSheetContent"></div>
    </div>

    <script>
        // 用於畫面上顯示時，過濾掉後綴字元
        function getDisplayId(id) {
            return id.replace(/\.TWO$|\.TW$/i, '');
        }

        const defaultChartData = [
            { id: "ROOT", parent: "", type: "root", change: 0 },
            { id: "科技巨頭", parent: "ROOT", type: "category", change: 0 },
            { id: "半導體與 AI", parent: "ROOT", type: "category", change: 0 },
            { id: "台股 ETF", parent: "ROOT", type: "category", change: 0 },
            
            { id: "AAPL", parent: "科技巨頭", type: "stock", change: 1.25, price: null, currency: 'USD', companyName: '' },
            { id: "MSFT", parent: "科技巨頭", type: "stock", change: 0.50, price: null, currency: 'USD', companyName: '' },
            { id: "GOOG", parent: "科技巨頭", type: "stock", change: -0.80, price: null, currency: 'USD', companyName: '' },
            { id: "AMZN", parent: "科技巨頭", type: "stock", change: 2.10, price: null, currency: 'USD', companyName: '' },

            { id: "NVDA", parent: "半導體與 AI", type: "stock", change: -2.40, price: null, currency: 'USD', companyName: '' },
            { id: "TSM", parent: "半導體與 AI", type: "stock", change: 1.80, price: null, currency: 'USD', companyName: '' },
            { id: "AMD", parent: "半導體與 AI", type: "stock", change: 3.20, price: null, currency: 'USD', companyName: '' },
            { id: "AVGO", parent: "半導體與 AI", type: "stock", change: -1.20, price: null, currency: 'USD', companyName: '' },
            { id: "QCOM", parent: "半導體與 AI", type: "stock", change: 0.40, price: null, currency: 'USD', companyName: '' },
            
            { id: "2330", parent: "台股 ETF", type: "stock", change: 2.10, price: null, currency: 'TWD', companyName: '' },
            { id: "2454", parent: "台股 ETF", type: "stock", change: -1.50, price: null, currency: 'TWD', companyName: '' },
            { id: "0050", parent: "台股 ETF", type: "stock", change: -0.15, price: null, currency: 'TWD', companyName: '' }
        ];

        let chartData = [];
        let currentMode = 'US';
        const workerApiUrl = 'https://aged-cloud-8fb4.arthur920616.workers.dev';
        let updateIntervalId = null;
        let isFetching = false;

        // ===== 在側邊欄圓環圖點選的分群，會在格狀熱力圖中被標示出來 =====
        let highlightedCategory = null;

        // ===== 顯示週期（當日 / 一週 / 兩週 / 一月）=====
        const PERIOD_KEY = 'custom_heatmap_period_v8';
        const PERIODS = {
            '1d':  { label: '當日漲跌', short: '當日', days: 0  },
            '3d':  { label: '三天漲跌', short: '三天', days: 3  },
            '1wk': { label: '一週漲跌', short: '一週', days: 7  },
            '2wk': { label: '兩週漲跌', short: '兩週', days: 14 },
        };
        let currentPeriod = localStorage.getItem(PERIOD_KEY) || '1d';
        if (!PERIODS[currentPeriod]) currentPeriod = '1d';

        let scale = 1, panX = 0, panY = 0;
        let isPanning = false, startMouseX = 0, startMouseY = 0;

        function updateTransform() { zoomLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

        function controlZoom(delta) {
            const rect = container.getBoundingClientRect();
            applyZoom(delta > 0 ? 1.2 : 0.8, rect.width / 2, rect.height / 2);
        }

        function resetZoom() {
            if (IS_MOBILE) { fitMobileView(); return; }
            scale = 1; panX = 0; panY = 0; updateTransform();
        }

        function applyZoom(multiplier, pointerX, pointerY) {
            const newScale = Math.max(0.2, Math.min(scale * multiplier, 5)); 
            panX = pointerX - (pointerX - panX) * (newScale / scale);
            panY = pointerY - (pointerY - panY) * (newScale / scale);
            scale = newScale; updateTransform();
        }

        container.addEventListener('wheel', (e) => {
            if (IS_MOBILE) return; // 行動版用原生捲動，不攔截

            applyZoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX - rect.left, e.clientY - rect.top);
        });

        container.addEventListener('mousedown', (e) => {
            if (IS_MOBILE) return; // 行動版用原生捲動
            if (e.target.closest('button')) return;
            isPanning = true; startMouseX = e.clientX - panX; startMouseY = e.clientY - panY;
            container.classList.add('grabbing-cursor');
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            panX = e.clientX - startMouseX; panY = e.clientY - startMouseY; updateTransform();
        });

        window.addEventListener('mouseup', () => { isPanning = false; container.classList.remove('grabbing-cursor'); });

        // ===== 行動版觸控手勢：單指拖曳平移、雙指 pinch 縮放 =====
        // （只在 IS_MOBILE 生效；電腦版用滑鼠滾輪/拖曳，完全不受影響）
        let touchMode = 0;            // 0=無, 1=單指拖曳, 2=雙指縮放
        let tStartX = 0, tStartY = 0; // 單指拖曳起點（已扣掉目前 pan）
        let pinchLastDist = 0;        // 上一個影格的兩指距離

        function touchDist(t) {
            const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
            return Math.hypot(dx, dy);
        }
        function touchMid(t) {
            const r = container.getBoundingClientRect();
            return { x: (t[0].clientX + t[1].clientX) / 2 - r.left, y: (t[0].clientY + t[1].clientY) / 2 - r.top };
        }

        container.addEventListener('touchstart', (e) => {
            if (!IS_MOBILE) return;
            if (e.target.closest('#zoomControls')) return; // 點縮放鈕不啟動拖曳
            if (e.touches.length === 1) {
                touchMode = 1;
                tStartX = e.touches[0].clientX - panX;
                tStartY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                touchMode = 2;
                pinchLastDist = touchDist(e.touches);
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            if (!IS_MOBILE || touchMode === 0) return;
            if (touchMode === 2 && e.touches.length === 2) {
                e.preventDefault();
                const d = touchDist(e.touches);
                if (pinchLastDist > 0) {
                    const m = touchMid(e.touches);
                    applyZoom(d / pinchLastDist, m.x, m.y); // 以兩指中點為焦點縮放
                }
                pinchLastDist = d;
            } else if (touchMode === 1 && e.touches.length === 1) {
                const nx = e.touches[0].clientX - tStartX;
                const ny = e.touches[0].clientY - tStartY;
                // 有實際位移才攔截瀏覽器預設行為；純點擊不攔截 → 仍可觸發 click（開詳情）
                if (Math.abs(nx - panX) + Math.abs(ny - panY) > 2) e.preventDefault();
                panX = nx; panY = ny; updateTransform();
            }
        }, { passive: false });

        function endTouch(e) {
            if (e.touches && e.touches.length === 1) {
                // 從雙指放開成單指 → 平順接續為拖曳
                touchMode = 1;
                tStartX = e.touches[0].clientX - panX;
                tStartY = e.touches[0].clientY - panY;
                pinchLastDist = 0;
            } else if (!e.touches || e.touches.length === 0) {
                touchMode = 0; pinchLastDist = 0;
            }
        }
        container.addEventListener('touchend', endTouch);
        container.addEventListener('touchcancel', endTouch);

        // 行動版進場：把整張圖縮放到「寬度剛好塞滿螢幕」，方便一眼看全部，再自行 pinch 放大
        function fitMobileView() {
            requestAnimationFrame(() => {
                const cw = container.clientWidth, ch = container.clientHeight;
                if (!cw || !ch) return;
                const prev = zoomLayer.style.transform;
                zoomLayer.style.transform = 'none';            // 先還原再量內容實際尺寸
                const lw = zoomLayer.scrollWidth || 1000;
                const lh = zoomLayer.scrollHeight || 800;
                zoomLayer.style.transform = prev;
                const fit = Math.min(cw / lw, ch / lh, 1);
                scale = Math.max(0.2, fit * 0.98);
                panX = Math.max(0, (cw - lw * scale) / 2);     // 水平置中
                panY = 12;
                updateTransform();
            });
        }

        function editCategory(oldId) {
            const newName = prompt(`請輸入「${oldId}」的新名稱：`, oldId);
            if (!newName || newName.trim() === "" || newName.trim() === oldId) return;
            if (chartData.find(d => d.id === newName.trim())) return showMessage("該分群名稱已存在！", true);
            const cat = chartData.find(d => d.id === oldId && d.type === 'category');
            if (cat) cat.id = newName.trim();
            chartData.forEach(d => { if (d.parent === oldId) d.parent = newName.trim(); });
            if (expandedCategories.has(oldId)) { expandedCategories.delete(oldId); expandedCategories.add(newName.trim()); }
            if (highlightedCategory === oldId) highlightedCategory = newName.trim();
            showMessage(`分群名稱已更新為：${newName.trim()}`); saveData(); updateAll(); scheduleCloudPush();
        }

        function editStock(oldId) {
            const stock = chartData.find(d => d.id === oldId && d.type === 'stock');
            if (!stock) return;
            const newId = prompt(`修改股票代號（原代號：${oldId}）：\n※ 台股上市請輸入數字，上櫃請加 .TWO (如 6547.TWO)`, oldId);
            if (!newId || newId.trim() === "" || newId.trim().toUpperCase() === oldId) return;
            if (chartData.find(d => d.id === newId.trim().toUpperCase())) return showMessage("該股票代號已存在清單中！", true);
            stock.id = newId.trim().toUpperCase(); stock.price = null; stock.change = 0; stock.companyName = ""; stock.currency = "USD";
            showMessage(`股票代號已更新，正在重新抓取報價...`); saveData(); updateAll(); scheduleCloudPush(); fetchRealTimeData();
        }

        function editInvestment(id) {
            const stock = chartData.find(d => d.id === id && d.type === 'stock');
            if (!stock) return;
            const cur = getInvested(stock);
            const input = prompt(`設定「${getDisplayId(id)}」目前投入的資金金額：\n（輸入 0 或留空可清除）`, cur ? String(cur) : '');
            if (input === null) return; // 按取消
            const val = parseFloat(String(input).replace(/[,\s$]/g, ''));
            if (input.trim() === '' || val === 0) {
                delete stock.invested;
                showMessage(`已清除 ${getDisplayId(id)} 的投入資金`);
            } else if (isNaN(val) || val < 0) {
                return showMessage('請輸入有效的金額', true);
            } else {
                stock.invested = val;
                showMessage(`已設定 ${getDisplayId(id)} 投入資金：$${fmtMoney(val)}`);
            }
            saveData(); updateAll(); scheduleCloudPush();
        }

        function addCategory() {
            const name = document.getElementById('catName').value.trim();
            if (!name) return showMessage('請輸入群組名稱', true);
            if (chartData.find(d => d.id === name)) return showMessage('該名稱已存在', true);
            chartData.push({ id: name, parent: "ROOT", type: 'category', change: 0 });
            expandedCategories.add(name); document.getElementById('catName').value = '';
            showMessage(`已新增群組: ${name}`); saveData(); updateAll(); scheduleCloudPush();
            
            // 加入新群組後，自動將下拉選單切換過去
            const stockParentSelect = document.getElementById('stockParent');
            if (stockParentSelect) stockParentSelect.value = name;
        }

        function addStock() {
            const name = document.getElementById('stockName').value.trim().toUpperCase();
            const parent = document.getElementById('stockParent').value;
            const change = 0; // 預設漲跌幅為 0
            if (!name || !parent) return showMessage('請輸入完整且正確的資料', true);
            
            const existingIndex = chartData.findIndex(d => d.id === name);
            if (existingIndex >= 0) {
                if(chartData[existingIndex].type !== 'stock') return showMessage('名稱衝突', true);
                chartData[existingIndex] = { ...chartData[existingIndex], parent: parent, change: change };
                showMessage(`已更新股票歸屬: ${name}`);
            } else {
                chartData.push({ id: name, parent: parent, type: 'stock', change: change, price: null, currency: 'USD', companyName: '', invested: 0 });
                showMessage(`已新增股票: ${name}`);
            }
            expandedCategories.add(parent); document.getElementById('stockName').value = '';
            saveData(); updateAll(); scheduleCloudPush(); fetchRealTimeData(); closeDrawerIfMobile();
        }

        function deleteItem(id) {
            if (id === 'ROOT') return showMessage('無法刪除根節點', true);
            let idsToDelete = new Set([id]), added = true;
            while(added) {
                added = false;
                chartData.forEach(d => { if (idsToDelete.has(d.parent) && !idsToDelete.has(d.id)) { idsToDelete.add(d.id); added = true; } });
            }
            chartData = chartData.filter(d => !idsToDelete.has(d.id));
            if (highlightedCategory && idsToDelete.has(highlightedCategory)) highlightedCategory = null;
            showMessage(`已刪除 ${id}`); saveData(); updateAll(); scheduleCloudPush();
        }

        // ====== 顯示週期：切換 / 套用 / 抓取歷史收盤 ======
        function periodLabel() { return (PERIODS[currentPeriod] || PERIODS['1d']).label; }

        function updatePeriodUI() {
            document.querySelectorAll('#periodSelector .period-btn').forEach(btn => {
                const active = btn.dataset.period === currentPeriod;
                btn.classList.toggle('bg-blue-600', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('shadow', active);
                btn.classList.toggle('text-slate-300', !active);
                btn.classList.toggle('hover:bg-slate-700', !active);
            });

        // 把每檔股票「目前顯示的 change」設成所選週期的值（其餘渲染程式只讀 d.change，故不需更動）
        function applyPeriod(render = true, allowFetch = true) {
            chartData.forEach(d => {
                if (d.type !== 'stock') return;
                if (!d._periods) d._periods = {};
                const v = d._periods[currentPeriod];
                d.change = (typeof v === 'number' && isFinite(v)) ? parseFloat(v.toFixed(2)) : 0;
            });
            updatePeriodUI();
            if (render) updateAll();
            if (allowFetch && currentPeriod !== '1d') {
                const need = chartData.some(d => d.type === 'stock' && (!d._periods || typeof d._periods[currentPeriod] !== 'number'));
                if (need) fetchHistoricalData();
            }
        }

        function setPeriod(p) {
            if (!PERIODS[p]) return;
            currentPeriod = p;
            localStorage.setItem(PERIOD_KEY, p);
            applyPeriod();
        }

        function toSymbol(id) {
            const s = id.toUpperCase();
            return /^\d+$/.test(s) ? s + '.TW' : s;
        }

        // 抓單一股票近 3 個月日線（先走 Worker 代理，失敗再試 Yahoo 直連）
        async function fetchOneChart(symbol) {
            const range = '3mo', interval = '1d';
            const urls = [
                `${workerApiUrl}?chart=${encodeURIComponent(symbol)}&range=${range}&interval=${interval}`,
                `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=${range}&interval=${interval}`,
                `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=${range}&interval=${interval}`,
            ];
            for (const u of urls) {
                try {
                    const res = await fetch(u);
                    if (!res.ok) continue;
                    const json = await res.json();
                    const r = json && json.chart && json.chart.result && json.chart.result[0];
                    if (r && r.timestamp && r.indicators && r.indicators.quote && r.indicators.quote[0] && r.indicators.quote[0].close) return r;
                } catch (e) { /* 換下一個來源 */ }
            }
            return null;
        }

        // 由日線收盤計算「N 個日曆天前 → 今天」的漲跌幅
        function pctFromCloses(timestamps, closes, lookbackDays) {
            if (lookbackDays <= 0) return null;
            let lastI = closes.length - 1;
            while (lastI >= 0 && closes[lastI] == null) lastI--;
            if (lastI < 1) return null;
            const last = closes[lastI];
            const targetTs = timestamps[lastI] - lookbackDays * 86400;
            let baseI = -1;
            for (let i = lastI - 1; i >= 0; i--) {
                if (closes[i] != null && timestamps[i] <= targetTs) { baseI = i; break; }
            }
            if (baseI < 0) { // 歷史不足 → 用最早一筆有效收盤
                for (let i = 0; i < lastI; i++) { if (closes[i] != null) { baseI = i; break; } }
            }
            if (baseI < 0) return null;
            const base = closes[baseI];
            if (!base) return null;
            return ((last - base) / base) * 100;
        }

        async function fetchHistoricalData() {
            if (isFetchingHist) return;
            const stocks = chartData.filter(d => d.type === 'stock');
            if (stocks.length === 0) return;
            isFetchingHist = true; toggleRefreshUI(true);
            const today = new Date().toISOString().slice(0, 10);
            let ok = 0, fail = 0;

            const chunk = 5; // 限制併發，對 Yahoo / Worker 友善
            for (let i = 0; i < stocks.length; i += chunk) {
                const batch = stocks.slice(i, i + chunk);
                await Promise.all(batch.map(async (d) => {
                    if (!d._periods) d._periods = {};
                    const cached = histCache[d.id];
                    if (cached && cached.date === today) { Object.assign(d._periods, cached.periods); ok++; return; }
                    const r = await fetchOneChart(toSymbol(d.id));
                    if (!r) { fail++; return; }
                    const ts = r.timestamp, closes = r.indicators.quote[0].close;
                    const raw = {
                        '3d':  pctFromCloses(ts, closes, 3),
                        '1wk': pctFromCloses(ts, closes, 7),
                        '2wk': pctFromCloses(ts, closes, 14),
                    };
                    const periods = {};
                    Object.keys(raw).forEach(k => { if (typeof raw[k] === 'number' && isFinite(raw[k])) periods[k] = raw[k]; });
                    Object.assign(d._periods, periods);
                    histCache[d.id] = { date: today, periods };
                    ok++;
                }));
            }

            isFetchingHist = false; toggleRefreshUI(isFetching || isFetchingHist);
            applyPeriod(true, false); // 重新渲染；不再自動回頭抓，避免持續失敗時無限重試
            if (ok === 0 && fail > 0) {
                showMessage('無法取得歷史資料：你的同步 Worker 可能尚未支援 chart 代理（請見檔案附帶說明）', true);
            } else if (fail > 0) {
                showMessage(`部分股票歷史資料抓取失敗（${fail} 檔）`, true);
            } else if (currentPeriod !== '1d') {
                document.getElementById('updateTimeText').textContent = `更新時間: ${new Date().toLocaleTimeString()}（${PERIODS[currentPeriod].short}）`;
            }
        }

        // 重整：報價（價格／名稱／當日）＋ 若在歷史週期則一併更新
        function refreshData() {
            fetchRealTimeData();
            if (currentPeriod !== '1d') fetchHistoricalData();
        }

        async function fetchRealTimeData() {
            if (isFetching) return;
            
            isFetching = true; toggleRefreshUI(true);

            const stocks = chartData.filter(d => d.type === 'stock');
            if (stocks.length === 0) { isFetching = false; toggleRefreshUI(false); return; }

            const symbolsQuery = stocks.map(s => /^\d+$/.test(s.id) ? s.id + ".TW" : s.id).join(',');
            const fetchUrl = `${workerApiUrl}?symbols=${symbolsQuery}`;

            try {
                const res = await fetch(fetchUrl);
                const rawText = await res.text();
                
                if (!res.ok) {
                    throw new Error(`伺服器或 Yahoo 阻擋 (HTTP ${res.status})`);
                }
                
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    throw new Error("Yahoo 回傳了無法解析的資料格式");
                }
                
                if (data && data.quoteResponse && data.quoteResponse.result) {
                    const quoteMap = {};
                    data.quoteResponse.result.forEach(q => { quoteMap[q.symbol.toUpperCase()] = q; });

                    chartData.forEach(d => {
                        if (d.type === 'stock') {
                            let querySymbol = d.id.toUpperCase();
                            if (/^\d+$/.test(querySymbol)) querySymbol += ".TW";
                            const quote = quoteMap[querySymbol];
                            if (quote) {
                                if (!d._periods) d._periods = {};
                                d._periods['1d'] = parseFloat((quote.regularMarketChangePercent || 0).toFixed(2));
                                d.price = parseFloat((quote.regularMarketPrice || 0).toFixed(2));
                                d.currency = quote.currency || 'USD';
                                d.companyName = quote.longName || quote.shortName || '';
                            }
                        }
                    });
                    saveData(); applyPeriod(true, true);
                    document.getElementById('updateTimeText').textContent = `更新時間: ${new Date().toLocaleTimeString()}`;
                    showMessage("即時數據同步成功！");
                } else throw new Error("無效的資料內容結構");
            } catch (err) {
                console.warn("API 連線失敗，啟用模擬:", err);
                document.getElementById('updateTimeText').textContent = `連線失敗，請檢查網路`;
                showMessage(`連線發生錯誤：${err.message}`, true);
            } finally { isFetching = false; toggleRefreshUI(isFetching || isFetchingHist); }
        }

        // ===== 資金配置圓環圖：各分群投入資金佔比 =====
        const ALLOC_PALETTE = ['#3b82f6','#14b8a6','#f59e0b','#a855f7','#ec4899','#10b981','#ef4444','#6366f1','#eab308','#06b6d4','#f43f5e','#84cc16'];

        function renderAllocationChart() {
            const host = document.getElementById('allocationPanel');
            if (!host) return;

            const data = chartData.filter(d => d.type === 'category').map(cat => ({
                name: cat.id,
                value: chartData.filter(s => s.type === 'stock' && s.parent === cat.id).reduce((sum, s) => sum + getInvested(s), 0)
            })).filter(d => d.value > 0);

            if (data.length === 0) {
                host.innerHTML = `<div class="text-[11px] text-slate-500 italic py-4 text-center leading-relaxed">尚未設定任何投入資金<br>點清單中股票旁的 <span class="text-amber-400">$</span> 圖示即可設定</div>`;
                return;
            }

            const grand = data.reduce((s, d) => s + d.value, 0);
            data.sort((a, b) => b.value - a.value); // 由大到小，圖例較好讀
            data.forEach((d, i) => d.color = ALLOC_PALETTE[i % ALLOC_PALETTE.length]);

            const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
            const sel = highlightedCategory;
            const selInData = !!sel && data.some(d => d.name === sel); // 被標示分群是否有投入資金（在圓環中）

            const size = 180, r = size / 2, inner = r * 0.62;
            const pie = d3.pie().value(d => d.value).sort(null).padAngle(0.015);
            const arcGen = d3.arc().innerRadius(inner).outerRadius(r).cornerRadius(3);
            const paths = pie(data).map(a => {
                const isSel = sel === a.data.name;
                const op = (selInData && !isSel) ? 0.3 : 1;
                const sw = isSel ? 2.5 : 1.5;
                const stroke = isSel ? '#fbbf24' : '#0f172a';
                return `<path data-cat="${esc(a.data.name)}" d="${arcGen(a)}" fill="${a.data.color}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" style="cursor:pointer"></path>`;
            }).join('');

            const svg = `
                <svg viewBox="${-r} ${-r} ${size} ${size}" width="100%" class="max-w-[190px] mx-auto block">
                    ${paths}
                    <text x="0" y="-6" text-anchor="middle" style="fill:#94a3b8;font-size:9px">總投入</text>
                    <text x="0" y="11" text-anchor="middle" style="fill:#f1f5f9;font-size:15px;font-weight:700;font-family:monospace">$${fmtMoney(grand)}</text>
                </svg>`;

            const legend = data.map(d => {
                const pct = (d.value / grand * 100).toFixed(1);
                const isSel = sel === d.name;
                const rowCls = isSel ? 'bg-amber-400/10 ring-1 ring-amber-400/40' : 'hover:bg-slate-700/40';
                return `<div data-cat="${esc(d.name)}" class="flex items-center gap-2 text-[11px] py-0.5 px-1 rounded cursor-pointer transition-colors ${rowCls}" title="點擊在熱力圖中標示此分群">
                    <span class="inline-block w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:${d.color}"></span>
                    <span class="flex-1 truncate ${isSel ? 'text-amber-200 font-semibold' : 'text-slate-200'}">${d.name}</span>
                    <span class="font-mono text-slate-400 w-10 text-right">${pct}%</span>
                    <span class="font-mono text-amber-300 w-[78px] text-right">$${fmtMoney(d.value)}</span>
                </div>`;
            }).join('');

            const hint = sel
                ? `<button onclick="highlightCategory(null)" class="w-full mt-2 text-[11px] text-amber-300 hover:text-amber-200 bg-amber-400/10 hover:bg-amber-400/20 border border-amber-400/30 rounded py-1 transition-colors">已標示「${sel}」${selInData ? '' : '（此分群未設投入資金）'} · 點此取消標示</button>`
                : `<div class="text-[10px] text-slate-500 text-center mt-2">點圓環、圖例或熱力圖分群標題，皆可互相標示</div>`;

            host.innerHTML = svg + `<div class="mt-3 space-y-0.5">${legend}</div>` + hint;

            host.querySelectorAll('[data-cat]').forEach(el => {
                el.addEventListener('click', () => highlightCategory(el.getAttribute('data-cat')));
            });
        }

        // 在側邊欄圓環圖點選分群 → 在格狀熱力圖中標示該分群（再點同一個或取消鈕則清除）
        function highlightCategory(name) {

            renderAllocationChart();

        function getChangeColor(change) {
            return currentMode === 'US'
                ? d3.scaleLinear().domain([-5, 0, 5]).range(["#dc2626", "#475569", "#16a34a"]).clamp(true)(change)
                : d3.scaleLinear().domain([-5, 0, 5]).range(["#16a34a", "#475569", "#dc2626"]).clamp(true)(change);

        // ===== 投入資金 / 市場分類 工具 =====
        function getInvested(stock) {
            return (stock && typeof stock.invested === 'number' && isFinite(stock.invested) && stock.invested > 0) ? stock.invested : 0;
        }
        function fmtMoney(n) {
            return Math.round(n).toLocaleString('en-US');

        // 判斷是否為台股：代號為純數字、或帶 .TW / .TWO 後綴、或報價幣別為 TWD
        function isTWStock(stock) {
            const id = (stock.id || '').toUpperCase();
            if (/\.TWO?$/.test(id)) return true;
            if (/^\d/.test(id)) return true;
            return stock.currency === 'TWD';
        }

        function buildMarketBox(label, mStocks, catId) {

            const col = getChangeColor(avgChange.toFixed(2));
            const cols = Math.ceil(Math.sqrt(mStocks.length));

            const box = document.createElement('div');
            box.className = "rounded-lg border-2 p-1";
            box.style.borderColor = col;
            box.style.backgroundColor = 'rgba(0,0,0,0.22)';

            const tag = document.createElement('div');
            tag.className = "text-[9px] font-bold px-1 pb-0.5 tracking-widest";
            tag.style.color = col;
            tag.textContent = label;
            box.appendChild(tag);

            const gridDiv = document.createElement('div');
            gridDiv.className = "grid gap-1";
            gridDiv.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            mStocks.forEach(stock => gridDiv.appendChild(buildStockTile(stock, catId)));
            box.appendChild(gridDiv);
            return box;
        }

        // 建立單一分群方塊（標頭 + 台股/美股子框）；格狀與圓環兩種版面共用
        function buildCategoryBox(cat) {
            const catStocks = chartData.filter(d => d.type === 'stock' && d.parent === cat.id);
            if (catStocks.length === 0) return null;

            const totalChange = catStocks.reduce((sum, stock) => sum + stock.change, 0);
            const avgChange = (totalChange / catStocks.length).toFixed(2);
            const avgColor = getChangeColor(avgChange);
            const totalInvested = catStocks.reduce((s, x) => s + getInvested(x), 0);

            const catDiv = document.createElement('div');
            catDiv.className = "bg-slate-900 border-2 rounded-xl overflow-hidden shadow-2xl flex flex-col transition-all";
            catDiv.style.borderColor = avgColor;

            const header = document.createElement('div');
            header.className = "px-3 py-2 bg-slate-800 border-b-2 flex items-center justify-between gap-2 cursor-pointer hover:bg-slate-700/80 transition-colors";
            header.style.borderBottomColor = avgColor;
            header.title = '點擊在資金配置圓環圖中標示此分群';
            header.innerHTML = `
                <span class="text-slate-100 font-bold text-[13px] tracking-wide">${cat.id}</span>
                <div class="flex items-center gap-1.5">
                    ${totalInvested > 0 ? `<span class="font-mono text-[10px] font-semibold px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30" title="此分群投入資金總額">$${fmtMoney(totalInvested)}</span>` : ''}
                    <span class="font-mono text-[11px] font-bold px-2 py-0.5 rounded bg-black/40 shadow-inner" style="color: ${avgColor}">${avgChange > 0 ? '+' : ''}${avgChange}%</span>
                </div>
            `;
            header.addEventListener('click', (e) => { e.stopPropagation(); highlightCategory(cat.id); });
            catDiv.appendChild(header);

            // 分群內再依市場切成「台股（上）／美股（下）」兩個子框
            const body = document.createElement('div');
            body.className = "p-1.5 flex flex-col gap-1.5";
            const twStocks = catStocks.filter(isTWStock);
            const usStocks = catStocks.filter(s => !isTWStock(s));
            [{ label: '台股', stocks: twStocks }, { label: '美股', stocks: usStocks }].forEach(g => {
                if (g.stocks.length === 0) return;
                body.appendChild(buildMarketBox(g.label, g.stocks, cat.id));
            });
            catDiv.appendChild(body);
            return catDiv;
        }

        // 格狀版面：分群方塊依序排列（原本的熱力圖）
        function renderTreemap() {
            zoomLayer.innerHTML = '';
            const stocks = chartData.filter(d => d.type === 'stock');
            if (stocks.length === 0) { document.getElementById('emptyState').classList.remove('hidden'); return; }
            document.getElementById('emptyState').classList.add('hidden');

            // 若被標示的分群已不存在，清掉標示
            if (highlightedCategory && !chartData.some(d => d.type === 'category' && d.id === highlightedCategory)) highlightedCategory = null;

            chartData.filter(d => d.type === 'category').forEach(cat => {
                const box = buildCategoryBox(cat);
                if (!box) return;
                // 側邊欄圓環圖點選後，在這裡把對應分群標示出來（其餘淡化）
                if (highlightedCategory) {
                    if (cat.id === highlightedCategory) {
                        box.style.boxShadow = '0 0 0 3px #fbbf24, 0 0 28px rgba(251,191,36,0.55)';
                        box.style.transform = 'scale(1.04)';
                        box.style.zIndex = '10';
                    } else {
                        box.style.opacity = '0.32';
                    }
                }
                zoomLayer.appendChild(box);
            });
        }

        // ========================================================
        //  雲端同步 (JSONBlob)  ── 只同步「清單結構＋顏色模式」，
        //  報價各裝置各自即時抓取，所以雲端資料很小、也不會頻繁寫入。
        // ========================================================

        // 取出要上雲的快照（不含即時報價）
        function structureSnapshot() {
            return {
                app: 'heatmap', v: 8,
                updatedAt: Date.now(),
                colorMode: currentMode,
                items: chartData
                    .filter(d => d.type === 'root' || d.type === 'category' || d.type === 'stock')
                    .map(d => d.type === 'stock'
                        ? { id: d.id, parent: d.parent, type: d.type, invested: getInvested(d) }
                        : { id: d.id, parent: d.parent, type: d.type })
            };
        }

        // 套用雲端快照（保留本機已抓到的報價，避免變空白）
        function applySnapshot(snap) {
            if (!snap || !Array.isArray(snap.items)) return false;
            const oldMap = {};
            chartData.forEach(d => { if (d.type === 'stock') oldMap[d.id] = d; });
            const rebuilt = snap.items.map(it => {
                if (it.type === 'stock') {
                    const o = oldMap[it.id] || {};
                    return {
                        id: it.id, parent: it.parent, type: 'stock',
                        change: (typeof o.change === 'number' ? o.change : 0),
                        price: (o.price !== undefined ? o.price : null),
                        currency: (o.currency || 'USD'),
                        companyName: (o.companyName || ''),
                        invested: (typeof it.invested === 'number' ? it.invested : getInvested(o))
                    };
                }
                return { id: it.id, parent: it.parent, type: it.type, change: 0 };
            });
            if (!rebuilt.find(d => d.type === 'root')) rebuilt.unshift({ id: 'ROOT', parent: '', type: 'root', change: 0 });
            chartData = rebuilt;
            if (snap.colorMode === 'US' || snap.colorMode === 'TW') { currentMode = snap.colorMode; updateColorModeButtonUI(); }
            chartData.forEach(d => { if (d.type === 'category') expandedCategories.add(d.id); });
            saveData();
            return true;
        }

        function setCloudUI() {
            const dot = document.getElementById('cloudDot');
            const statusText = document.getElementById('cloudStatusText');
            const setup = document.getElementById('cloudSetup');
            const connected = document.getElementById('cloudConnected');
            if (!dot) return;
            if (syncBlobId) {
                setup.classList.add('hidden');
                connected.classList.remove('hidden');
                document.getElementById('cloudCodeText').textContent = syncBlobId;
                dot.className = "ml-auto inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500";
                dot.title = "雲端同步已啟用";
                statusText.textContent = "已啟用，變更會自動上傳、開啟時自動拉取";
            } else {
                setup.classList.remove('hidden');
                connected.classList.add('hidden');
                dot.className = "ml-auto inline-flex h-2.5 w-2.5 rounded-full bg-slate-500";
                dot.title = "未連線";
                statusText.textContent = "尚未啟用雲端同步";
                // 尚未連線時一律展開，確保設定區可見
                cloudCollapsed = false;
                localStorage.setItem(CLOUD_COLLAPSE_KEY, '0');
            }
            // 依目前狀態套用收合外觀
            applyCloudCollapse();
        }

        function cloudFlash(busy) {
            const dot = document.getElementById('cloudDot');
            if (dot && syncBlobId) dot.style.opacity = busy ? '0.35' : '1';
        }

        // 建立新的雲端資料，取得同步碼
        async function cloudEnable() {
            const btn = document.getElementById('cloudEnableBtn');
            btn.disabled = true; btn.textContent = '建立中…';
            try {
                const snap = structureSnapshot();
                const res = await fetch(syncBase(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(snap)
                });
                if (!res.ok) throw new Error('伺服器回應 HTTP ' + res.status);
                let id = '';
                if (usingProxy()) {
                    // 代理伺服器把新建的同步碼放在回應 JSON 的 id 欄位
                    const data = await res.json().catch(() => ({}));
                    id = (data && data.id ? String(data.id) : '').trim();
                    if (!id) throw new Error('代理伺服器未回傳同步碼（請確認 Worker 程式碼）');
                } else {
                    // 直連 JSONBlob：同步碼在 Location 回應標頭
                    const loc = res.headers.get('Location');
                    if (!loc) throw new Error('瀏覽器讀不到同步碼（CORS 限制）。建議改用下方「自訂同步伺服器」');
                    id = loc.split('/').filter(Boolean).pop();
                }
                if (!id) throw new Error('同步碼格式異常');
                syncBlobId = id;
                lastStructureTs = snap.updatedAt;
                localStorage.setItem(SYNC_ID_KEY, syncBlobId);
                localStorage.setItem(STRUCT_TS_KEY, String(lastStructureTs));
                setCloudUI();
                setCloudCollapsed(true); // 連線完成 → 自動收起整個雲端同步區塊
                showMessage('雲端同步已啟用！複製同步碼或連結到其他裝置即可');
            } catch (err) {
                let msg = err.message || String(err);
                if (/fetch/i.test(msg)) msg = '無法連線（可能被瀏覽器 CORS 或網路擋下）。建議設定下方「自訂同步伺服器」';
                showMessage('啟用失敗：' + msg, true);
            } finally {
                btn.disabled = false; btn.textContent = '☁️ 啟用雲端同步（建立同步碼）';
            }
        }

        // 用同步碼（或連結）連線到既有雲端資料
        async function cloudJoin(idArg) {
            const input = document.getElementById('cloudJoinInput');
            let id = (idArg || (input ? input.value : '') || '').trim();
            if (id.includes('sync=')) id = id.split('sync=').pop();
            if (id.includes('/')) id = id.split('/').filter(Boolean).pop();
            id = id.replace('#', '').trim();
            if (!id) return showMessage('請貼上同步碼', true);
            try {
                const ok = await cloudPull(true, id);
                if (ok) {
                    syncBlobId = id;
                    localStorage.setItem(SYNC_ID_KEY, syncBlobId);
                    setCloudUI();
                    setCloudCollapsed(true); // 連線完成 → 自動收起整個雲端同步區塊
                    if (input) input.value = '';
                    showMessage('已連線並從雲端載入清單！');
                    updateAll(); fetchRealTimeData(); closeDrawerIfMobile();
                }
            } catch (err) {
                showMessage('連線失敗：' + err.message, true);
            }
        }

        // 從雲端讀取；adopt=true 強制採用，否則只在雲端較新時採用
        async function cloudPull(adopt, idOverride) {
            const id = idOverride || syncBlobId;
            if (!id) return false;
            cloudFlash(true);
            try {
                const res = await fetch(syncBase() + '/' + id, { headers: { 'Accept': 'application/json' } });
                if (res.status === 404) throw new Error('找不到此同步碼的資料');
                if (!res.ok) throw new Error('伺服器回應 HTTP ' + res.status);
                const snap = await res.json();
                const remoteTs = snap.updatedAt || 0;
                if (adopt || remoteTs > lastStructureTs) {
                    applySnapshot(snap);
                    lastStructureTs = remoteTs || Date.now();
                    localStorage.setItem(STRUCT_TS_KEY, String(lastStructureTs));
                    if (!adopt) { updateAll(); fetchRealTimeData(); }
                    return true;
                }
                return false;
            } finally {
                cloudFlash(false);
            }
        }

        // 結構有變動 → 立即更新本機時間戳，並延遲 0.7 秒批次上傳
        function scheduleCloudPush() {
            if (!syncBlobId) return;
            lastStructureTs = Date.now();
            localStorage.setItem(STRUCT_TS_KEY, String(lastStructureTs));
            if (cloudPushTimer) clearTimeout(cloudPushTimer);
            cloudPushTimer = setTimeout(cloudPush, 700);
        }

        async function cloudPush() {
            if (!syncBlobId) return;
            cloudFlash(true);
            try {
                const snap = structureSnapshot();
                snap.updatedAt = lastStructureTs || Date.now();
                const res = await fetch(syncBase() + '/' + syncBlobId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(snap)
                });
                if (!res.ok) throw new Error('伺服器回應 HTTP ' + res.status);
            } catch (err) {
                showMessage('雲端上傳失敗：' + err.message, true);
            } finally {
                cloudFlash(false);
            }
        }

        async function cloudPullNow() {
            if (!syncBlobId) return;
            try {
                const changed = await cloudPull(true);
                showMessage(changed ? '已從雲端更新清單' : '雲端沒有資料變更');
                updateAll(); fetchRealTimeData(); closeDrawerIfMobile();
            } catch (err) { showMessage('拉取失敗：' + err.message, true); }
        }

        function cloudUnlink() {
            if (!confirm('要中斷此裝置的雲端同步嗎？\n（雲端資料與其他裝置不受影響，本機清單會保留）')) return;
            syncBlobId = null;
            localStorage.removeItem(SYNC_ID_KEY);
            setCloudUI();
            setCloudCollapsed(false); // 中斷後展開，方便重新設定
            showMessage('已中斷此裝置的雲端同步');
        }

        function cloudCopyCode() {
            if (!syncBlobId) return;
            navigator.clipboard?.writeText(syncBlobId)
                .then(() => showMessage('已複製同步碼'))
                .catch(() => showMessage('請手動複製：' + syncBlobId, true));
        }

        function cloudCopyLink() {
            if (!syncBlobId) return;
            const link = location.origin + location.pathname + '#sync=' + syncBlobId;
            navigator.clipboard?.writeText(link)
                .then(() => showMessage('已複製同步連結，在其他裝置開啟即可自動同步'))
                .catch(() => showMessage('請手動複製：' + link, true));
        }

        function parseSyncFromHash() {
            const m = location.hash.match(/sync=([A-Za-z0-9_-]+)/);
            return m ? m[1] : null;
        }

        // 視窗大小變化時，若跨越行動版/電腦版分界就重新渲染
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const nowMobile = window.matchMedia('(max-width: 768px)').matches;
                if (nowMobile !== IS_MOBILE) {
                    IS_MOBILE = nowMobile;
                    if (!IS_MOBILE) { closeMobileSheet(); scale = 1; panX = 0; panY = 0; }
                    renderChart();
                }
            }, 200);
        });

        // 回到此分頁時，自動從雲端拉取其他裝置的最新變更
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && syncBlobId) cloudPull(false).catch(() => {});
        });

        window.onload = async function() {
            loadData();
            setCloudUI();
            if (IS_MOBILE) sidebar.classList.add('hidden'); // 手機預設收起抽屜，先看到熱力圖

            const hashId = parseSyncFromHash();
            if (hashId && hashId !== syncBlobId) {
                await cloudJoin(hashId);          // 透過同步連結開啟 → 自動連線並載入
            } else if (syncBlobId) {
                try { await cloudPull(true); } catch (e) { /* 離線則沿用本機資料 */ }
                setCloudUI();
            }

            updateAll();
            applyAllocCollapse();
            updatePeriodUI();
            handleAutoUpdateSetup();
            fetchRealTimeData();
        };
    </script>
</body>
</html>
